name: Phase 1 - Learn Runner

on:
  push:
    branches:
      - main

jobs:
  first-job:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Say Hello
        run: echo "Hello Faruq!"

      - name: Display File
        run: cat hello.txt

      - name: Show Current Directory
        run: pwd

      - name: List Repository Files
        run: ls -la

      - name: Show Current User
        run: whoami

      - name: Show Operating System
        run: uname -a

      - name: Show Java Version
        run: java -version

      - name: Show Git Version
        run: git --version
        
      - name: Create Folder
        run: mkdir build
        
      - name: Copy File
        run: cp hello.txt build/

      - name: Show Build Folder
        run: ls build
        
      - name: Rename hello.txt to greeting.txt
        run: mv hello.txt greeting.txt
      
      - name: Show Build Folder after Rename
        run: ls build
        
